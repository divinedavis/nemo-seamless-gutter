server {
    server_name nemoseamlessgutter.com www.nemoseamlessgutter.com 104.236.120.144;

    # www and non-www both resolve here, so without this nginx serves the
    # whole site twice under two hostnames. Canonical tags already point at
    # the bare domain; this makes it a real 301 so crawlers and any old
    # www links consolidate on one host.
    if ($host = www.nemoseamlessgutter.com) {
        return 301 https://nemoseamlessgutter.com$request_uri;
    }

    root /var/www/nemo-seamless-gutter;
    index index.html;

    # A dedicated log, not the shared catch-all. The combined format carries no
    # Host field, so requests for this site mixed into the droplet's default
    # access.log cannot be told apart from the other sites here — which makes
    # per-site traffic (and therefore the growth engine's measurements)
    # impossible. growth/metrics.py reads this file.
    access_log /var/log/nginx/nemo-access.log nemo;

    # Call-tap beacon. analytics.js pings this when a tel: link is tapped; the
    # only thing it needs to do is appear in nemo-access.log, which growth's
    # metrics.py reads. 204 with no body and no cache, so it costs a log line.
    # Answering here rather than letting it 404 keeps the error log clean and
    # means the status is 2xx, which is what the parser counts.
    location = /e/call-tap {
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # The growth engine keeps one pre-edit copy of every page it touches as
    # <page>.growth-bak, alongside the page, inside the docroot. Those were
    # being served: /index.html.growth-bak returned 200. Nothing secret in
    # them, but they are near-duplicates of the real pages sitting on a site
    # whose entire purpose is local SEO ranking — exactly the content Google
    # penalises — plus a public record of what the engine rewrote and when.
    location ~* \.(growth-bak|bak|orig|tmp|save|swp)$ { deny all; return 404; }

    location ^~ /server/ { deny all; return 404; }
    location ^~ /seo/ { deny all; return 404; }
    # The growth engine's ledger, tracked keywords and measurement history.
    # Never web-served: it is internal business data, not site content.
    location ^~ /growth/ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Booking API -> Node on 3009
    location /api/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Booking management pages (owner cancel/decline links) -> Node.
    # Logged WITHOUT the query string: ?uid=..&sig=.. is the credential that
    # authorises cancelling or moving that booking, and the default log would
    # write it in the clear on every visit.
    location /booking/ {
        access_log /var/log/nginx/nemo-access.log nemo_noargs;
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Owner day-control page (open/close a day for weather) -> Node.
    # Signed-link gated in the app; noindex so it never reaches a crawler.
    # Same query-string redaction as /booking/ — the owner sig does not expire.
    location /owner/ {
        access_log /var/log/nginx/nemo-access.log nemo_noargs;
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/nemo-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|woff2?)$ {
        expires 30d;
        include /etc/nginx/snippets/nemo-security-headers.conf;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/nemo-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nemoseamlessgutter.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nemoseamlessgutter.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.nemoseamlessgutter.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nemoseamlessgutter.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nemoseamlessgutter.com www.nemoseamlessgutter.com 104.236.120.144;
    return 404; # managed by Certbot




}