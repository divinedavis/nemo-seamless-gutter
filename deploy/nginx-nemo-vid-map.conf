# Visitor-id cookie for the pageview beacon. Deployed at
# /etc/nginx/conf.d/nemo_vid_map.conf (maps must live in http{} context).
#
# Set server-side, not by script, because Safari ITP caps script-written
# cookies at 7 days — a returning visitor would read as new every week. Same
# pattern as findacrib.com's fac_vid. Only handed out when the request doesn't
# already carry one, so the id survives for the cookie's whole year.
#
# Not HttpOnly on purpose: analytics.js has to read it to put it on the
# /e/pv beacon, which is the only place it is ever sent or stored. $request_id
# is 16 random bytes from nginx — no time component, nothing derivable.
map $cookie_nemo_vid $nemo_vid_setcookie {
    ""      "nemo_vid=$request_id; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    default "";
}
