# host-aware access log format (combined + vhost) for per-site logs
log_format site "$host $remote_addr - $remote_user [$time_local] "
                "\"$request\" $status $body_bytes_sent "
                "\"$http_referer\" \"$http_user_agent\"";

# NEMO: combined + the owner-opt-out cookie as a trailing field.
# growth/metrics.py drops any request carrying it, so the developer's own
# devices stay out of the traffic numbers no matter what address they are on —
# an IP list can't follow a phone through iCloud Private Relay or a hotspot.
# The field is appended, not inserted, so log lines written before this change
# still parse against the same regex.
log_format nemo '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" "$cookie_nemo_owner"';
