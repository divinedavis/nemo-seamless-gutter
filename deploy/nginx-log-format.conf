# host-aware access log format (combined + vhost) for per-site logs
log_format site "$host $remote_addr - $remote_user [$time_local] "
                "\"$request\" $status $body_bytes_sent "
                "\"$http_referer\" \"$http_user_agent\"";

# NEMO: combined + the owner-opt-out cookie as a trailing field.
# growth/metrics.py drops any request carrying it, so the developer's own
# devices stay out of the traffic numbers no matter what address they are on —
# an IP list can't follow a phone through iCloud Private Relay or a hotspot.
# The field is appended, not inserted, so log lines written before this change
# still parse against the same regex.
log_format nemo '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" "$cookie_nemo_owner"';

# Same shape as `nemo`, but logs $uri (path only) instead of $request (which
# includes the query string). Used for /booking/ and /owner/, whose links carry
# their own credential in the query — the uid+sig on a management link IS the
# authority to cancel or move that booking, and the owner schedule sig is a
# permanent key to the whole calendar. Logging those verbatim puts working
# credentials in a plaintext file that is read by the growth engine, rotated
# into .gz archives, and readable by anyone with shell access.
#
# Field count and ordering are unchanged so growth/metrics.py parses these lines
# with the same regex.
log_format nemo_noargs '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" "$cookie_nemo_owner"';
