# Security response headers for the static site.
#
# Included per-location rather than set once at server level ON PURPOSE: nginx
# `add_header` is inherited from the enclosing block ONLY when the current block
# declares no add_header of its own. Several locations here set Cache-Control,
# which would silently drop every security header inherited from above. Every
# location that emits headers includes this file so that can't happen.
#
# The booking API (/api/, /booking/, /owner/) sets its own headers in Node and
# does NOT include this file — its CSP is much tighter, since those pages load
# no third-party anything.
#
# `always` so the headers are still sent on error responses (404/50x), which are
# HTML too and are just as framable/sniffable as a 200.

# Third-party origins are enumerated, not wildcarded. 'unsafe-inline' for
# scripts is required by the GA4 bootstrap and the JSON-LD blocks in every page
# head; it is still worth shipping, because the enumerated host list is what
# stops an injected <script src> from pulling code off an attacker's domain.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# strict-origin-when-cross-origin, not no-referrer: Search Console and the
# growth engine's referrer attribution both need the origin to survive.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
