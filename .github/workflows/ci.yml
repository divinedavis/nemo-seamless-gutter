# Every push and PR: secrets scan over the pushed commits + scripts/test.sh.
# The same two gates run locally in .githooks/pre-push; this catches pushes
# from everywhere the hook isn't installed — the droplet's daily
# growth/publish_state.sh, the 7am review agent in Anthropic's cloud, other
# worktrees, --no-verify. Public repo, so the minutes are free. No secrets are
# used: the API tests run with email, calendars and weather forced off.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Match the droplet: python3 3.12, node 20.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server --no-audit --no-fund
      - run: scripts/test.sh
