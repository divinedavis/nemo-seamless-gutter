# Weekly dependency update PRs, one grouped PR per ecosystem/directory.
# Owner 2026-10-01: "lets do weekly update". Free: Dependabot itself never
# bills; this repo either is public (CI free) or has no workflows to run.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release: hijacked-maintainer releases
    # are usually yanked within days. Security fixes are exempt (immediate).
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/hero3d"
    schedule:
